name: CI/CD - Build, Push to ACR, Deploy to AKS

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

env:
  IMAGE_NAME: sprinbootapp
  IMAGE_TAG: latest
  ACR_NAME: springbootdockerreg
  ACR_LOGIN_SERVER: springbootdockerreg.azurecr.io
  RG: kubernetes-mgmt-srv
  AKS_NAME: azure-aks-hpa
  DEPLOYMENT_NAME: springboot-app
  NAMESPACE: default
  EMAIL_RECIPIENTS: erwwtwqetwq@gmail.com
  EMAIL_FROM: tewewtewtq@gmail.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Check out from Git
        uses: actions/checkout@v4
        with:
          ref: prod

      # ---------- Maven ----------
      - name: Set up JDK & Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'   # change to match your app's Java version
          cache: 'maven'

      - name: Maven Package
        run: mvn package

      # ---------- Docker build ----------
      - name: Build Docker image
        run: docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .

      # ---------- Azure login ----------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # ---------- Docker push ----------
      - name: Tag & Push image to ACR
        run: |
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}

      # ---------- AKS deploy ----------
      - name: Set subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ env.RG }} --name ${{ env.AKS_NAME }} --overwrite-existing

      - name: Deploy to AKS
        run: kubectl apply -f k8s/sprinboot-deployment.yaml

      # ---------- Verify rollout ----------
      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${NAMESPACE} --timeout=60s

      # ---------- Notifications ----------
      - name: Send success email
        if: success()
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": {"email": "${{ env.EMAIL_FROM }}"},
              "to": [{"email": "${{ env.EMAIL_RECIPIENTS }}"}],
              "subject": "SUCCESS: GitHub Actions ${{ github.workflow }} #${{ github.run_number }}",
              "textContent": "Good news!\n\nThe workflow ${{ github.workflow }} run #${{ github.run_number }} completed successfully, and the deployment '"${DEPLOYMENT_NAME}"' rolled out successfully to AKS.\n\nRun URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }')
          echo "Brevo responded with HTTP $http_code"
          cat response.json
          if [ "$http_code" -ge 400 ]; then exit 1; fi

      - name: Send failure email
        if: failure()
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": {"email": "${{ env.EMAIL_FROM }}"},
              "to": [{"email": "${{ env.EMAIL_RECIPIENTS }}"}],
              "subject": "FAILED: GitHub Actions ${{ github.workflow }} #${{ github.run_number }}",
              "textContent": "The workflow ${{ github.workflow }} run #${{ github.run_number }} FAILED.\n\nThis could be due to a build/deploy step failing, or the deployment '"${DEPLOYMENT_NAME}"' failing to roll out successfully in AKS.\n\nRun URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }')
          echo "Brevo responded with HTTP $http_code"
          cat response.json
          if [ "$http_code" -ge 400 ]; then exit 1; fi
